<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四字色盘调影 — 小工具网页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="flex flex-col items-center py-10 px-4">

    <!-- 背景装饰 -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="w-full max-w-4xl space-y-8">

        <!-- 标题 + 返回链接 -->
        <div class="flex items-center justify-between mb-2">
            <a href="./index.html" class="glass-btn secondary text-sm px-4 py-2">
                ← 返回工具列表
            </a>
        </div>
        <div class="text-center mb-6">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-gray-200 to-gray-500 tracking-wider" style="filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));">
                四字色盘调影
            </h1>
            <p class="text-gray-400 mt-2 font-medium">输入文案 🎨 定制色彩 🚀 一键导出</p>
        </div>

        <!-- 上半部分：预览与设置 -->
        <div class="glass tilt-card p-8" id="top-card">
            <div class="glass-content">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                    <!-- 设置区域 -->
                    <div class="col-span-1 space-y-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-300 mb-2">输入文字 (最多提取前4个字)</label>
                            <input type="text" id="text-input" class="glass-input w-full text-lg" value="旭瑞初升" placeholder="请输入文字...">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-300 mb-2">字体大小 <span id="size-val" class="font-normal text-gray-400">80px</span></label>
                            <input type="range" id="size-slider" min="40" max="160" value="80">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-300 mb-2">字间距 <span id="spacing-val" class="font-normal text-gray-400">10px</span></label>
                            <input type="range" id="spacing-slider" min="0" max="80" value="10">
                        </div>
                    </div>

                    <!-- 预览区域 -->
                    <div class="col-span-1 md:col-span-2 flex items-center justify-center bg-black/20 rounded-2xl border border-white/10 shadow-inner p-4 overflow-hidden" style="min-height: 250px;">
                        <div id="preview-container" class="flex justify-center items-center whitespace-nowrap">
                            <!-- 预览字符由JS生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 下半部分：调色板 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6" id="palettes-container">
            <!-- 调色板由JS生成 -->
        </div>

        <!-- 导入/导出 操作区 -->
        <div class="glass tilt-card p-8">
            <div class="glass-content space-y-4">
                <h3 class="text-lg font-bold text-gray-200 border-b border-white/10 pb-2">数据交互</h3>
                <div class="flex flex-col md:flex-row gap-4 items-stretch">
                    <textarea id="data-io" class="glass-input flex-1 h-24 resize-none font-mono text-sm" placeholder="导出结果或在此粘贴导入数据。&#10;格式示例：旭00E9F0 瑞FF8B00 初FF2A2A 升2AFF45"></textarea>
                    <div class="flex flex-row md:flex-col gap-3 justify-center">
                        <button id="btn-export" class="glass-btn flex-1 md:flex-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            导出
                        </button>
                        <button id="btn-import" class="glass-btn secondary flex-1 md:flex-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            导入
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Toast -->
    <div id="toast" class="toast">提示信息</div>

    <script>
        // 初始状态
        let state = {
            text: "旭瑞初升",
            colors: ["#00E9F0", "#FF8B00", "#FF2A2A", "#2AFF45"],
            fontSize: 80,
            spacing: 10
        };

        const textInput = document.getElementById('text-input');
        const sizeSlider = document.getElementById('size-slider');
        const spacingSlider = document.getElementById('spacing-slider');
        const sizeVal = document.getElementById('size-val');
        const spacingVal = document.getElementById('spacing-val');
        const previewContainer = document.getElementById('preview-container');
        const palettesContainer = document.getElementById('palettes-container');
        const dataIo = document.getElementById('data-io');
        const btnExport = document.getElementById('btn-export');
        const btnImport = document.getElementById('btn-import');
        const toast = document.getElementById('toast');

        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? `${parseInt(result[1],16)}, ${parseInt(result[2],16)}, ${parseInt(result[3],16)}` : '0, 0, 0';
        }

        function showToast(msg, duration = 2000) {
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, duration);
        }

        function renderPalettes() {
            palettesContainer.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const char = state.text[i] || '空';
                const color = state.colors[i];
                const rgb = hexToRgb(color);

                const card = document.createElement('div');
                card.className = 'glass tilt-card p-4 flex flex-col items-center justify-center space-y-4';

                card.innerHTML = `
                    <div class="glass-content w-full flex flex-col items-center">
                        <div class="text-2xl font-extrabold text-gray-100 mb-2 tracking-widest">${char}</div>
                        <div class="relative group">
                            <input type="color" id="color-picker-${i}" value="${color}" class="cursor-pointer">
                            <div class="absolute inset-0 rounded-full shadow-inner pointer-events-none"></div>
                        </div>
                        <div class="mt-4 w-full bg-black/20 rounded-xl p-3 text-center border border-white/10">
                            <div class="text-sm font-bold text-gray-200 tracking-wider font-mono uppercase" id="hex-display-${i}">${color}</div>
                            <div class="text-xs text-gray-400 mt-1 font-mono">RGB: <span id="rgb-display-${i}">${rgb}</span></div>
                        </div>
                    </div>
                `;
                palettesContainer.appendChild(card);

                const picker = document.getElementById(`color-picker-${i}`);
                picker.addEventListener('input', (e) => {
                    const newColor = e.target.value;
                    state.colors[i] = newColor.toUpperCase();
                    document.getElementById(`hex-display-${i}`).textContent = state.colors[i];
                    document.getElementById(`rgb-display-${i}`).textContent = hexToRgb(state.colors[i]);
                    updatePreview();
                });
            }
            init3DTilt();
        }

        function updatePreview() {
            previewContainer.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                if (state.text[i]) {
                    const span = document.createElement('span');
                    span.className = 'preview-char inline-block';
                    span.textContent = state.text[i];
                    span.style.color = state.colors[i];
                    span.style.fontSize = `${state.fontSize}px`;
                    span.style.marginRight = i < (state.text.length > 4 ? 3 : state.text.length - 1) ? `${state.spacing}px` : '0';
                    previewContainer.appendChild(span);
                }
            }
        }

        function syncUI() {
            textInput.value = state.text;
            sizeSlider.value = state.fontSize;
            spacingSlider.value = state.spacing;
            sizeVal.textContent = `${state.fontSize}px`;
            spacingVal.textContent = `${state.spacing}px`;
            renderPalettes();
            updatePreview();
        }

        // 文本输入
        textInput.addEventListener('input', (e) => {
            const val = e.target.value.replace(/\s+/g, '');
            state.text = val.substring(0, 4);
            renderPalettes();
            updatePreview();
        });

        // 尺寸滑块
        sizeSlider.addEventListener('input', (e) => {
            state.fontSize = e.target.value;
            sizeVal.textContent = `${state.fontSize}px`;
            updatePreview();
        });

        // 间距滑块
        spacingSlider.addEventListener('input', (e) => {
            state.spacing = e.target.value;
            spacingVal.textContent = `${state.spacing}px`;
            updatePreview();
        });

        // 导出
        btnExport.addEventListener('click', () => {
            let exportStr = [];
            for (let i = 0; i < 4; i++) {
                if (state.text[i]) {
                    exportStr.push(state.text[i] + state.colors[i].replace('#', '').toUpperCase());
                }
            }
            const finalStr = exportStr.join(' ');
            dataIo.value = finalStr;
            try {
                dataIo.select();
                document.execCommand('copy');
                showToast('🎉 导出成功并已复制到剪贴板！');
            } catch (err) {
                showToast('✅ 导出成功！(自动复制失败，请手动复制)');
            }
        });

        // 导入
        btnImport.addEventListener('click', () => {
            const inputStr = dataIo.value.trim();
            if (!inputStr) {
                showToast('⚠️ 请输入要导入的数据！');
                return;
            }
            const regex = /(.)([0-9a-fA-F]{6})/g;
            let match, count = 0;
            let newText = "", newColors = [...state.colors];
            while ((match = regex.exec(inputStr)) !== null && count < 4) {
                newText += match[1];
                newColors[count] = '#' + match[2].toUpperCase();
                count++;
            }
            if (count === 0) {
                showToast('❌ 导入失败，未检测到正确格式！\n示例：旭00E9F0 瑞FF8B00');
                return;
            }
            state.text = newText;
            state.colors = newColors;
            syncUI();
            showToast(`✅ 成功导入 ${count} 个字符色彩配置！`);
        });

        // 3D 鼠标互动
        function init3DTilt() {
            document.querySelectorAll('.tilt-card:not([data-tilt-init])').forEach(card => {
                card.setAttribute('data-tilt-init', 'true');
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const cx = rect.width / 2;
                    const cy = rect.height / 2;
                    card.style.setProperty('--mouse-x', x + 'px');
                    card.style.setProperty('--mouse-y', y + 'px');
                    card.style.transform = 'perspective(1000px) rotateX(' + ((y-cy)/cy*-2.5) + 'deg) rotateY(' + ((x-cx)/cx*2.5) + 'deg) scale3d(1.01,1.01,1.01)';
                });
                card.addEventListener('mouseleave', () => {
                    card.style.transition = 'transform 0.5s cubic-bezier(0.25,0.8,0.25,1)';
                    card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
                });
                card.addEventListener('mouseenter', () => {
                    card.style.transition = 'transform 0.1s ease-out';
                });
            });
        }

        // 启动
        syncUI();
        init3DTilt();
    </script>
</body>
</html>
